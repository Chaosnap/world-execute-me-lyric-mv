<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>world.execute(me);</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: #b9cfe3; font: 13px/1.5 Consolas, "JetBrains Mono", monospace; }
  /* the picture fills the window at 16:9, black bars on the longer side */
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #000; }
  #frame { --w: min(100vw, 100vh * 16 / 9); position: relative; width: var(--w); height: min(100vh, 100vw * 9 / 16); }
  @supports (height: 100dvh) { #frame { --w: min(100vw, 100dvh * 16 / 9); height: min(100dvh, 100vw * 9 / 16); } }
  canvas#view { display: block; width: 100%; height: 100%; background: #000; }
  body.idle, body.idle * { cursor: none; }
  body.export #stage { position: static; display: block; }
  body.export #frame, body.export canvas#view { width: auto; height: auto; }
  body.export #error, body.export #prompt { display: none; }
  /* the end of the countdown on the first pass: a command line that runs the film on Enter (or a click / tap). Set
     like the warning page's lines (src/scenes/overlay.js: x 300, the line under the countdown, 44 px mono, in the
     greys of the `off` palette), in units of the 1920 px wide picture */
  #prompt { position: absolute; left: calc(300 / 1920 * 100%); top: calc(895 / 1080 * 100%); font: 400 calc(var(--w) * 44 / 1920) / 1.2 "JetBrains Mono", monospace;
    white-space: pre; color: #aaa89f; cursor: pointer; opacity: 0; transition: opacity 0.3s; }
  #prompt.show { opacity: 1; }
  #prompt.done { opacity: 0; transition: opacity 0.35s 0.1s; }
  #prompt .ps, #prompt .note { color: #6f6e67; }
  #prompt .note { opacity: 0; transition: opacity 0.4s; }
  #prompt.typed .note { opacity: 1; }
  #prompt .cur { display: inline-block; width: 0.6em; height: 1.1em; vertical-align: -0.22em; background: #d2d0c8; animation: blink 1.06s steps(1) infinite; }
  #prompt.done .cur { visibility: hidden; }
  @keyframes blink { 50% { opacity: 0; } }
  /* the warning page fades in from black with its first frame (src/main.js) */
  canvas#view:not(.on) { opacity: 0; }
  canvas#view { transition: opacity 0.4s; }
  body.export canvas#view { transition: none; opacity: 1; }
  /* only when the film cannot start */
  #error { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); max-width: 80vw; color: #e8788f; white-space: pre-wrap; }
</style>
</head>
<body class="idle">
<div id="stage"><div id="frame">
  <canvas id="view"></canvas>
  <div id="prompt" hidden><span class="ps">$ </span><span class="cmd"></span><span class="cur"></span><span class="note"></span></div>
</div></div>
<div id="error" hidden></div>
<audio id="audio" preload="auto"></audio>
<script type="module" src="src/main.js"></script>
</body>
</html>
